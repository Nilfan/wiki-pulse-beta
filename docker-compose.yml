services:
  postgres:
    image: postgres:17
    container_name: nextjs-local-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nextjs_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
